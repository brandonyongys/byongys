summary: |
  Backend software engineer with 5+ years of experience building production systems on AWS and Kubernetes, mainly in healthcare. Experienced in Python backend development, cloud infrastructure, chatbot platforms, and AI-enabled systems serving large user populations. Background in machine learning research, with published work in PLOS One and Quantitative Finance. Currently focused on backend engineering, cloud architecture, Terraform, and applied AI systems. AWS Certified Solutions Architect, Developer Associate, and HashiCorp Terraform Associate.


